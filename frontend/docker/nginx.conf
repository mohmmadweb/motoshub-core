# Serves the built SPA and proxies API/WS/static to the Django ASGI container.
upstream api { server api:8000; }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;
    root /usr/share/nginx/html;

    # REST API → Django
    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (chat/realtime) → ASGI with upgrade headers
    location /ws/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Django static/admin/media
    location /static/ { proxy_pass http://api; proxy_set_header Host $host; }
    # Uploads live on a shared volume — nginx serves them directly.
    location /media/  { alias /usr/share/nginx/media/; expires 30d; add_header Cache-Control "public"; }

    # SPA: hashed assets are immutable; everything else falls back to index.html
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
