# TLS overlay — see infra/tls/README.md
# usage: DOMAIN=your.domain docker compose -f infra/docker-compose.yml -f infra/tls/compose.tls.yml up -d
services:
  web:
    ports: !override
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN to the certificate's domain}
    volumes:
      - ./tls/nginx.tls.conf:/etc/nginx/templates/default.conf.template:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot

  api:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY:?set a real SECRET_KEY for production}
      OW_PASSWORD_PEPPER: ${OW_PASSWORD_PEPPER:?set the shared pepper for production}
      ALLOWED_HOSTS: ${DOMAIN}
      CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
      CORS_ALLOWED_ORIGINS: https://${DOMAIN}
      DEBUG: "False"

volumes:
  letsencrypt:
  certbot_www:
