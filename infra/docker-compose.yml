# Full local stack: Postgres + Redis + Django API + Celery worker + Vite SPA (nginx).
# Run from the repo root:  docker compose -f infra/docker-compose.yml up --build
# Then:  Web  http://localhost   ·   API docs  http://localhost/api/v1/docs/
name: motoshub-core

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: motoshub_core
      POSTGRES_USER: motoshub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-motoshub}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motoshub"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: docker/Dockerfile
    command: web
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      SECRET_KEY: ${SECRET_KEY:-dev-secret}
      DEBUG: "True"
      DATABASE_URL: postgres://motoshub:motoshub@db:5432/motoshub_core
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      OW_PASSWORD_PEPPER: ${OW_PASSWORD_PEPPER:-dev-shared-pepper}
      ALLOWED_HOSTS: "*"
    volumes:
      - media:/app/media          # uploads survive restarts; nginx serves them
    ports:
      - "8000:8000"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build:
      context: ../backend
      dockerfile: docker/Dockerfile
    command: worker
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      SECRET_KEY: ${SECRET_KEY:-dev-secret}
      DATABASE_URL: postgres://motoshub:motoshub@db:5432/motoshub_core
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      OW_PASSWORD_PEPPER: ${OW_PASSWORD_PEPPER:-dev-shared-pepper}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  # Vite SPA built to static assets and served by nginx, which also reverse-
  # proxies /api, /ws, /static, /media to the Django container (see
  # frontend/docker/nginx.conf). The browser talks to a single origin (:80).
  web:
    build:
      context: ../frontend
      dockerfile: docker/Dockerfile
      args:
        VITE_API_BASE: /api/v1
    volumes:
      - media:/usr/share/nginx/media:ro
    ports:
      - "80:80"
    depends_on:
      - api

  # Nightly database dumps with retention (see infra/backup/README.md).
  backup:
    image: postgres:16-alpine
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: motoshub_core
      POSTGRES_USER: motoshub
      PGPASSWORD: ${POSTGRES_PASSWORD:-motoshub}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - ./backup/backup.sh:/usr/local/bin/backup.sh:ro
      - ./backup/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - pgbackups:/backups
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}

volumes:
  pgdata:
  pgbackups:
  media:
