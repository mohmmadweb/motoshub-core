# Full local stack: Postgres + Redis + Django API + Celery worker + Next frontend.
# Run from the repo root:  docker compose -f infra/docker-compose.yml up --build
# Then:  API  http://localhost:8000/api/v1/docs/   ·   Web  http://localhost:3000
name: motoshub-core

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: motoshub_core
      POSTGRES_USER: motoshub
      POSTGRES_PASSWORD: motoshub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motoshub"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: docker/Dockerfile
    command: web
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      SECRET_KEY: dev-secret
      DEBUG: "True"
      DATABASE_URL: postgres://motoshub:motoshub@db:5432/motoshub_core
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      OW_PASSWORD_PEPPER: dev-shared-pepper
      ALLOWED_HOSTS: "*"
    ports:
      - "8000:8000"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build:
      context: ../backend
      dockerfile: docker/Dockerfile
    command: worker
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      SECRET_KEY: dev-secret
      DATABASE_URL: postgres://motoshub:motoshub@db:5432/motoshub_core
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      OW_PASSWORD_PEPPER: dev-shared-pepper
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  web:
    build:
      context: ../frontend
      dockerfile: docker/Dockerfile
      args:
        BACKEND_ORIGIN: http://api:8000
    environment:
      # Browser uses relative /api/v1 → proxied by nginx (:80) or Next (:3000).
      BACKEND_ORIGIN: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - web
      - api

volumes:
  pgdata:
