# prod.shub.ir — serves the SPA and proxies the API, published on dedicated host
# ports so nothing else on the machine is disturbed.
#
# The API address is resolved per request through Docker's embedded DNS
# (127.0.0.11) rather than a static upstream: nginx resolves a plain `server`
# directive once at startup, so recreating the api container hands out a new IP
# and every request 502s until nginx is restarted as well.

# Everything the two server blocks share. Kept in one place so the plain-HTTP
# listener cannot quietly drift away from the TLS one.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Left reachable for ACME. The certificate is renewed over DNS-01, but a
    # webroot challenge remains possible without editing this file under time
    # pressure.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # Everything else moves to TLS. The port is carried over because this
    # deployment does not own 80/443 on the host.
    location / {
        return 301 https://$host:${HTTPS_PORT}$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    client_max_body_size 25m;
    root /usr/share/nginx/html;

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    # TLS 1.2+ only, forward secrecy, and no server-dictated cipher order —
    # modern clients pick better suites than a hardcoded list would.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS is set here as well as by Django, so it covers the static assets
    # nginx serves without ever reaching the application.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_host api;

    location /api/ {
        proxy_pass http://$api_host:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django trusts this to decide a request arrived over TLS; it is set
        # from $scheme rather than hardcoded so the value is never a fiction.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /ws/ {
        proxy_pass http://$api_host:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
    location /static/ {
        proxy_pass http://$api_host:8000$request_uri;
        proxy_set_header Host $host;
    }
    location /media/  { alias /usr/share/nginx/media/; expires 30d; add_header Cache-Control "public"; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location /        { try_files $uri $uri/ /index.html; }
}
