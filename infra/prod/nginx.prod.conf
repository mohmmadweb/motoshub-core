# prod.shub.ir — serves the SPA and proxies the API on the container's port 80,
# published on a dedicated host port so nothing else on the machine is disturbed.
# ACME challenges are served from /.well-known so a certificate can be issued
# without stopping anything.
#
# The API address is resolved per request through Docker's embedded DNS
# (127.0.0.11) rather than a static upstream: nginx resolves a plain `server`
# directive once at startup, so recreating the api container hands out a new IP
# and every request 502s until nginx is restarted as well.
server {
    listen 80;
    server_name _;
    client_max_body_size 25m;
    root /usr/share/nginx/html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_host api;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location /api/ {
        proxy_pass http://$api_host:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /ws/ {
        proxy_pass http://$api_host:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
    location /static/ {
        proxy_pass http://$api_host:8000$request_uri;
        proxy_set_header Host $host;
    }
    location /media/  { alias /usr/share/nginx/media/; expires 30d; add_header Cache-Control "public"; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location /        { try_files $uri $uri/ /index.html; }
}
